# Sistema guionado. Cada respuesta está escrita a mano para producir un caso concreto,
# incluida una que FALLA a propósito: sin un fallo real en el guion, los checks de M2 se
# escribirían contra datos que siempre pasan, que es la forma más fácil de escribir un
# eval que no mide nada.
responses:
  "¿Cuál es el torque de apriete del perno M24 grado 8.8 del cabezal del laminador 2?":
    answer: "El torque de apriete es 680 ± 30 N·m."
    citations:
      - doc_id: LAM-2-MAINT
        revision: D
        page: 147
        # El texto del chunk citado es lo que hace verificable `grounded`. Sin esto el
        # check no puede correr y devuelve n/a — no "no fundamentado".
        text: |
          Tabla 7.3 — Pares de apriete del cabezal.
          M20 grado 8.8: 400 ± 20 N·m
          M24 grado 8.8: 680 ± 30 N·m
          M27 grado 10.9: 950 ± 40 N·m
    # `retrieved` en orden de ranking. El chunk de oro (p147) llega tercero: recall@3
    # lo encuentra, recall@1 no, y precision@3 = 1/3. Guionado así a propósito para que
    # el reporte de M4 no salga con todo en 1.0, que no probaría nada.
    retrieved:
      - {doc_id: LAM-2-MAINT, page: 12, chunk_id: "maint-012-a"}
      - {doc_id: LAM-2-MAINT, page: 150, chunk_id: "maint-150-a"}
      - {doc_id: LAM-2-MAINT, page: 147, chunk_id: "maint-147-b", revision: D}
    abstained: false

  # FALLA A PROPÓSITO: contesta con 950, que es otra fila de la tabla. Es exactamente el
  # bug de la tabla partida, y `forbidden_numbers` tiene que atraparlo en M2.
  "¿Qué es la alarma E-114?":
    answer: "La alarma E-114 corresponde a un torque de 950 N·m en el cojinete."
    citations:
      - doc_id: LAM-2-ALARMS
        revision: B
        page: 12
        # El chunk NO menciona ningún 950: el número de la respuesta es inventado, y
        # `grounded` tiene que dar falso sobre este caso.
        text: |
          E-114 — Sobretemperatura del cojinete de salida.
          Umbral de disparo 95 °C. Rearme manual desde el pupitre.
    # Recuperó el chunk correcto en el rank 1 y AUN ASI contestó mal. Esa combinación es
    # la que separa un problema de retrieval de uno de generación: sin `retrieved` en el
    # contrato, este caso se diagnosticaría como "falló la búsqueda", que es falso.
    retrieved:
      - {doc_id: LAM-2-ALARMS, page: 12, chunk_id: "alarms-012-a", revision: B}
    abstained: false

  # Control negativo respondido bien: se abstiene.
  "¿Cuál es el torque del perno M30 del cabezal del laminador 2?":
    answer: null
    citations: []
    # Recuperó chunks parecidos (el M24 de al lado) y aun así se abstuvo. Eso es lo
    # correcto: recuperar algo no obliga a responder.
    retrieved:
      - {doc_id: LAM-2-MAINT, page: 147, chunk_id: "maint-147-b", revision: D}
    abstained: true
