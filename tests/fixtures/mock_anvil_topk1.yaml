  ¿Cuál es el procedimiento de bloqueo y etiquetado (LOTO) de la linea de colada?:
    answer: 1) Notificar a produccion y detener la linea. 2) Abrir el seccionador
      principal QS-1 y verificar ausencia de tension. 3) Colocar candado personal
      y tarjeta de identificacion en QS-1. 4) Purgar la linea hidraulica y confirmar
      presion cero en el manometro PI-7. 5) Verificar enclavamiento antes de iniciar
      la intervencion.
