# ── procedimental (4) ───────────────────────────────────────────────────────
# Prueban que no se corten los pasos. El corpus tiene el LOTO como 5 chunks
# `procedure` separados: si el chunker los aísla, el sistema devuelve un paso suelto y
# eso, en un procedimiento de seguridad, es peor que no responder.

  - id: loto-linea-colada-completo
    question: "¿Cuál es el procedimiento de bloqueo y etiquetado (LOTO) de la linea de colada?"
    category: procedimental
    difficulty: hard
    languages: [es]
    gold_answer: >-
      1) Notificar a produccion y detener la linea. 2) Abrir el seccionador principal
      QS-1 y verificar ausencia de tension. 3) Colocar candado personal y tarjeta de
      identificacion en QS-1. 4) Purgar la linea hidraulica y confirmar presion cero en
      el manometro PI-7. 5) Verificar enclavamiento antes de iniciar la intervencion.
    gold_numbers: []
    forbidden_numbers: []
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: loto-presion-cero
    question: "¿Dónde se confirma la presion cero durante el LOTO de la linea de colada?"
    category: procedimental
    difficulty: medium
    languages: [es]
    gold_answer: "En el manometro PI-7, despues de purgar la linea hidraulica."
    gold_numbers: []
    forbidden_numbers: []
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: loto-primer-paso
    question: "¿Cuál es el primer paso del LOTO de la linea de colada?"
    category: procedimental
    difficulty: easy
    languages: [es]
    # Discrimina orden: un sistema que devuelve "el paso que mejor puntuó" en vez del
    # primero contesta el del candado o el del seccionador.
    gold_answer: "Notificar a produccion y detener la linea."
    gold_numbers: []
    forbidden_numbers: []
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: montaje-cabezal-superficies
    question: "Antes de montar el cabezal, ¿qué hay que verificar en las superficies?"
    category: procedimental
    difficulty: medium
    languages: [es]
    gold_answer: "Que esten libres de cascarilla."
    gold_numbers: []
    forbidden_numbers: []
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

