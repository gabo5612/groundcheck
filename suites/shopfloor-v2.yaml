# ════════════════════════════════════════════════════════════════════════════════
# v2 — preguntas sobre documentos MULTIPÁGINA
#
# Las 20 de arriba viven en LAM-2, que tiene UNA página. Como el oro se empareja a
# nivel de página, su recall es trivialmente 1.00: cualquier chunk de esa página
# cuenta como relevante. Las de acá abajo son las que dan señal de retrieval real —
# salen del TM (117 páginas, inglés) y de Trailplugin (15 páginas, español).
# ════════════════════════════════════════════════════════════════════════════════

# ── factual_lookup sobre documentos largos ─────────────────────────────────
  - id: tm-hoja-okc3s-largo
    question: "How long is the OKC-3S bayonet blade?"
    category: factual_lookup
    difficulty: medium
    languages: [en]
    gold_answer: "8.00 in. (20.32 cm) long"
    gold_numbers: ["8.00", "20.32"]
    # Las medidas del M9, que es el otro modelo de la MISMA frase: si aparecen,
    # el sistema mezcló los dos cuchillos.
    forbidden_numbers: ["7", "17.78"]
    gold_source: {doc_id: 75b2742de4b3a05f, revision: A, pages: [22]}

  - id: tm-hoja-okc3s-ancho
    question: "How wide is the OKC-3S bayonet blade?"
    category: factual_lookup
    difficulty: medium
    languages: [en]
    gold_answer: "1.375 in. (3.49 cm) wide"
    gold_numbers: ["1.375", "3.49"]
    forbidden_numbers: ["1.4", "3.56"]      # el ancho del M9
    gold_source: {doc_id: 75b2742de4b3a05f, revision: A, pages: [22]}

  - id: tm-hoja-m9-largo
    question: "How long is the M9 bayonet blade?"
    category: factual_lookup
    difficulty: hard
    languages: [en]
    # Par discriminante con las dos anteriores: mismo dato, otro modelo. Y la respuesta
    # correcta NO es un valor exacto sino una cota ("more than 7 in."), que es donde un
    # sistema que quiere dar un número redondo se inventa la precisión.
    gold_answer: "More than 7 in. (17.78 cm) long"
    gold_numbers: ["7", "17.78"]
    forbidden_numbers: ["8.00", "20.32"]
    gold_source: {doc_id: 75b2742de4b3a05f, revision: A, pages: [22]}

  - id: tm-pmcs-inactivo
    question: "How many days without use make a bayonet 'inactive' for PMCS purposes?"
    category: factual_lookup
    difficulty: medium
    languages: [en]
    gold_answer: "90 days stored in an arms room without use"
    gold_numbers: ["90"]
    forbidden_numbers: []
    gold_source: {doc_id: 75b2742de4b3a05f, revision: A, pages: [27]}

  - id: tm-partes-vaina-m9
    question: "How many major parts does the M9 scabbard consist of, and which are they?"
    category: factual_lookup
    difficulty: medium
    languages: [en]
    gold_answer: >-
      Four: the scabbard body, wire cutter plate, attaching assembly load-bearing end,
      and attaching assembly scabbard end.
    # Sin `gold_numbers`: el chunk dice "four", la PALABRA, no el dígito. Los números
    # escritos con letras no son verificables por coincidencia literal, y poner "4" acá
    # haría fallar la respuesta correcta. Limitación conocida del enfoque, documentada en
    # el README. Lo que se mide en este caso es que cite bien y no invente partes.
    gold_numbers: []
    forbidden_numbers: []
    gold_source: {doc_id: 75b2742de4b3a05f, revision: A, pages: [22]}

  - id: tp-version-nextjs
    question: "¿Qué versión de Next.js usa el sitio de TrailKit?"
    category: factual_lookup
    difficulty: easy
    languages: [es]
    gold_answer: "Next.js 14.2.29 (App Router)"
    gold_numbers: []
    # `4.24` va acá y no en forbidden_codes: con un solo separador es estructuralmente
    # indistinguible de un decimal, y el extractor lo clasifica como número. Las versiones
    # de DOS partes caen siempre de ese lado; las de tres (1.9.4) son identificadores.
    # No es un bug: es la ambigüedad real, y el set se adapta a lo que el harness hace.
    forbidden_numbers: ["4.24"]
    forbidden_codes: ["1.9.4"]             # Leaflet, fila vecina de la misma tabla
    gold_source: {doc_id: 3f328ec9cc2bb39f, pages: [3]}

  - id: tp-version-nextauth
    question: "¿Qué versión de NextAuth usa TrailKit?"
    category: factual_lookup
    difficulty: medium
    languages: [es]
    gold_answer: "NextAuth 4.24"
    gold_numbers: ["4.24"]                 # ver la nota de tp-version-nextjs
    forbidden_numbers: []
    forbidden_codes: ["14.2.29", "1.9.4"]
    gold_source: {doc_id: 3f328ec9cc2bb39f, pages: [3]}

