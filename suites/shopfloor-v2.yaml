# ════════════════════════════════════════════════════════════════════════════════
# Golden set v2 (M8) — sistema bajo prueba: shopfloor
#
# 39 preguntas · 9 controles negativos (23%)
#
# CORPUS: shopfloor/demo/corpus.json — 5 documentos, 1699 chunks. Cada número de este
# archivo se leyó del chunk que lo respalda; ninguno se estimó. Verificable con
# `python3 scripts/verify_against_corpus.py <corpus> suites/shopfloor-v2.yaml`.
#
# QUÉ CAMBIÓ DESDE v1 (y por qué importa)
# v1 tenía 18 de 20 preguntas sobre LAM-2, que es un documento de UNA página. Como el
# oro se empareja a nivel de página, su recall era trivialmente 1.00: cualquier chunk
# de esa página contaba como relevante. v2 agrega 19 preguntas sobre documentos
# MULTIPÁGINA — el TM de 117 páginas en inglés y Trailplugin de 15 en español — que
# son las que dan señal de retrieval real.
#
# ⚠️ NOTA DE FIDELIDAD AL CORPUS: el spec (§3) usa como ejemplo "M24 grado 8.8 →
# 680 N·m". El corpus real dice 720 ± 30. Este set usa 720. Copiar el 680 habría
# medido a shopfloor contra un número que no está en la documentación.
#
# ❌ DOS CATEGORÍAS SIGUEN AUSENTES, y no es olvido:
#   · multi_documento     — el corpus no tiene ninguna relación genuina entre dos
#                           documentos (un manual de laminador, uno militar de EE.UU.,
#                           un informe del Congreso, un procedimiento del DOE y la doc
#                           de TrailKit). Una pregunta que cruce dos sería artificial, y
#                           una pregunta de oro falsa es peor que una categoría vacía.
#                           Necesita corpus: p.ej. un WPS y el ITP que lo referencia.
#   · revision_supersedida — los 5 documentos existen en UNA sola revisión cada uno. No
#                           hay ningún dato cuya respuesta haya cambiado entre revisiones.
#                           Necesita dos revisiones de un mismo documento.
# El 20% de controles negativos NO se tocó: subió a 23%. Es la métrica que impide que
# un sistema que siempre responde con seguridad puntúe perfecto.
# ════════════════════════════════════════════════════════════════════════════════
name: shopfloor-v2
cases:

# ── factual_lookup (8) ──────────────────────────────────────────────────────
# Prueban chunking estructural: si la Tabla 4-7 se partió mal, el sistema devuelve la
# fila equivocada. `forbidden_numbers` son SIEMPRE las otras filas de la misma tabla,
# porque ese es el error concreto que hay que atrapar — no "una respuesta algo distinta".

  - id: torque-m24-grado-88
    question: "¿Cuál es el par de apriete del perno M24 del cabezal en grado 8.8?"
    category: factual_lookup
    difficulty: easy
    languages: [es]
    gold_answer: "720 +/- 30 N.m, en secuencia cruzada, 3 pasadas"
    gold_numbers: ["720", "30"]
    forbidden_numbers: ["950", "190"]   # filas M24 10.9 y M16 tapa
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: torque-m24-grado-109
    question: "¿Qué par de apriete corresponde al M24 del cabezal en grado 10.9?"
    category: factual_lookup
    difficulty: medium
    languages: [es]
    # Par discriminante con la anterior: MISMO perno, grado distinto. Un sistema que
    # ignora el grado contesta 720 a las dos y acá se lo ve.
    gold_answer: "950 +/- 40 N.m"
    gold_numbers: ["950", "40"]
    forbidden_numbers: ["720", "190"]
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: torque-m16-tapa
    question: "¿Cuál es el torque del perno M16 de la tapa?"
    category: factual_lookup
    difficulty: easy
    languages: [es]
    gold_answer: "190 +/- 10 N.m, cruzada, 2 pasadas"
    gold_numbers: ["190", "10"]
    forbidden_numbers: ["720", "950"]
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: precalentamiento-a516-espeso
    question: "¿Qué precalentamiento requiere el A516 Gr.70 en espesores mayores a 20 mm?"
    category: factual_lookup
    difficulty: medium
    languages: [es]
    gold_answer: "95 C"
    gold_numbers: ["95"]
    forbidden_numbers: ["80"]           # la fila del A106 Gr.B
    # El 20 NO va en forbidden: aparece legítimamente en la respuesta al citar el espesor.
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: precalentamiento-a106
    question: "¿Cuál es la temperatura de precalentamiento para el A106 Gr.B?"
    category: factual_lookup
    difficulty: easy
    languages: [es]
    gold_answer: "80 C, para cualquier espesor"
    gold_numbers: ["80"]
    forbidden_numbers: ["95"]
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: precalentamiento-a516-delgado
    question: "¿Hay que precalentar el A516 Gr.70 de 15 mm de espesor?"
    category: factual_lookup
    difficulty: hard
    languages: [es]
    # La respuesta correcta NO tiene número: es "ninguno". Un sistema que se siente
    # obligado a devolver una cifra va a inventar 95 u 80, y los dos están prohibidos.
    # Es el caso más parecido a una alucinación sin ser control negativo.
    gold_answer: "Ninguno. Hasta 20 mm el A516 Gr.70 no requiere precalentamiento."
    gold_numbers: []
    forbidden_numbers: ["95", "80"]
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: pasadas-cabezal
    question: "¿En cuántas pasadas se aprietan los pernos del cabezal y con qué patrón?"
    category: factual_lookup
    difficulty: easy
    languages: [es]
    gold_answer: "3 pasadas, en patron cruzado"
    gold_numbers: ["3"]
    forbidden_numbers: ["2"]            # la tapa M16 usa 2 pasadas
    gold_source: {doc_id: c0d5f95f636967d1, revision: F, pages: [1]}

  - id: version-leaflet-trailkit
    question: "¿Qué versión de Leaflet usa el sitio de TrailKit?"
    category: factual_lookup
