# ── procedimental ──────────────────────────────────────────────────────────
  - id: tk-cuando-expira
    question: "¿Cómo se marca una licencia como vencida?"
    category: procedimental
    difficulty: hard
    languages: [es]
    # El detalle no obvio: NO hay proceso aparte. El vencimiento se materializa al
    # consultarse. Un sistema que "razona" contesta que hay un cron, que es lo plausible.
    gold_answer: >-
      La validación en lib/license.ts la marca como expired en la base de datos cuando
      detecta que venció durante la validación: el vencimiento se materializa al
      consultarse, no por un proceso aparte.
    gold_numbers: []
    forbidden_numbers: []
    gold_source: {doc_id: 3f328ec9cc2bb39f, pages: [7]}

  - id: tk-middleware-admin
    question: "¿Qué hace el middleware con las rutas bajo /admin?"
    category: procedimental
    difficulty: medium
    languages: [es]
    gold_answer: "Devuelve 404 sin contenido: oculta el panel antiguo."
    gold_numbers: ["404"]
    forbidden_numbers: []
    gold_source: {doc_id: 3f328ec9cc2bb39f, pages: [8]}

