[project]
name = "assay"
version = "0.1.0"
description = "Harness de evals para sistemas RAG: mide si recupera lo correcto, responde con fundamento, cita bien y se calla cuando no sabe"
requires-python = ">=3.12"

# Una sola dependencia de runtime, a proposito: el golden set lo escribe y lo revisa
# una persona, y YAML es el unico formato donde un comentario explicando POR QUE una
# entrada existe sobrevive al archivo. Todo lo demas es stdlib.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
assay = "assay.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]
